name: One-off build check # typed brief retry
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-off-build-check.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
